name: SAST

on:
  push:
  pull_request:

jobs:
  sast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Лабораторная_работа_№2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install bandit pip-audit semgrep

      - name: Bandit (Medium и High останавливают сборку)
        run: bandit -r app -ll

      - name: pip-audit (информационно)
        run: pip-audit -r requirements.txt --no-deps --disable-pip
        continue-on-error: true

      - name: Semgrep (любая находка останавливает сборку)
        run: semgrep scan app --config p/default --error
